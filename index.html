<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      text-align: center;
      padding: 20px;
      overflow-x: hidden; /* Mencegah munculnya scrollbar horizontal saat animasi berjalan */
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 450px;
      width: 100%;
    }

    /* KARTU PERTAMA */
    .card-1 {
      background: rgba(255, 255, 255, 0.15);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      
      /* Animasi Masuk dari Kiri */
      animation: cardOneSequence 10s ease-in-out 10s forwards;
      opacity: 0;
    }

    /* KARTU KEDUA */
    .card-2 {
      background: rgba(255, 255, 255, 0.15);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      
      /* Animasi Masuk dari Kanan setelah Kartu 1 */
      animation: cardTwoSequence 2s ease-in-out 10s forwards;
      opacity: 0;
    }

         /* KARTU KETIGA */
    .card-3 {
      background: rgba(225, 255, 255, 0.15);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

       /* Animasi: Tunggu Kartu 2 Hilang -> Muncul -> Tetap Malayang */
      animation: cardTwoSequence 6s ease-in-out 5.5s forwards;
      opacity: 0;
    }

    /* Aturan untuk Kartu 3 */
    .card-3 {
      background: rgba(255, 255, 255, 0.15);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      animation: cardThreeSequence 8s ease-in-out 12s forwards;
      opacity: 0;
    }

    /* Mengatur Ukuran Gambar GIF */
    .gift-mp4 {
      width: 100%;
      max-width: 250px;
      border-radius: 120px;
      margin-top: 150px;
    }

    /* Keyframes Animasi Kartu 3 */
    @keyframes cardThreeSequence {
      0% {
        opacity: 0;
        transform: translateY(50px);
      }
      20%, 100% {
        opacity: 1;
        transform: translateY(0);
      }
    }


    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
    }

    /* BALON MELAYANG */
    .balloon-container {
      margin-top: 15px;
      font-size: 2.2rem;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .balloon {
      display: inline-block;
      animation: bounce 1.8s infinite ease-in-out alternate;
    }

    .balloon:nth-child(2) { animation-delay: 0.3s; }
    .balloon:nth-child(3) { animation-delay: 0.6s; }

    /* --- ANIMASI KARTU PERTAMA (Kiri ke Kanan) --- */
    @keyframes cardOneSequence {
      0% {
        opacity: 0;
        transform: translateX(-120%);
      }
      15%, 80% {
        opacity: 1;
        transform: translateX(0);
      }
      100% {
        opacity: 0;
        transform: translateY(0px);
      }
    }

    /* --- ANIMASI KARTU KEDUA (Kanan ke Kiri) --- */
    @keyframes cardTwoSequence {
      0% {
        opacity: 0;
        transform: translateX(120%);
      }
      20% {
        opacity: 1;
        transform: translateX(0);
      }
      50%, 100% {
        opacity: 1;
        transform: translateY(0px);
      }
    }

      /* --- ANIMASI KARTU KETIGA --- */
    @keyframes cardTwoSequence {
      0% {
        opacity: 0;
        transform: translateX(120%);
      }
      20% {
        opacity: 1;
        transform: translateX(0);
      }
      50%, 100% {
        opacity: 1;
        transform: translateY(-20px);
      }
    }
    
    /* BALON MELAYANG */
    .balloon-container {
      margin-top: 15px;
      font-size: 2.2rem;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .balloon {
      display: inline-block;
      animation: bounce 1.8s infinite ease-in-out alternate;
    }

    .balloon:nth-child(2) { animation-delay: 0.3s; }
    .balloon:nth-child(3) { animation-delay: 0.6s; }


    /* ANIMASI MEMBAL BALON */
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Kartu 1: Muncul Pertama, Lalu melayang -->
    <div class="card-1">
      <h1>🎉 Happy Birthday! 🎂</h1>
      <p>Met ultah @alizalsabela, Semoga harimu selalu always dan semua yu hep drim is tercapai!</p>
    </div>

    <!-- Kartu 2: Muncul Setelah Kartu 1 -->
    <div class="card-2">
      <p>Sekali kali gunakan AI dengan baik dan benar, bersama AI jayakan indonesia, SELAMAT ULANG TAHUN INDONESIA YG KE-81</p>
      
      <div class="balloon-container">
        <span class="balloon">🎈</span>
        <span class="balloon">🎈</span>
        <span class="balloon">🎈</span>
      </div>
    </div>
  </div>

   <!-- Kartu 3: Muncul Setelah Kartu 2 -->
  <div class="card-3">
    <p>🎁</p>
      <img src="stutu.mp4" alt="Gift MP4" class="gift-mp4">
    </div>
</body>
</html>
