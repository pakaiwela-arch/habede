<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 450px;
      width: 100%;
    }

    /* DESAIN DASAR KARTU */
    .card-1, .card-2, .card-3 {
      background: rgba(255, 255, 255, 0.15);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      opacity: 0;
    }

    /* KARTU PERTAMA: Masuk dari Kiri (Cepat, langsung muncul) */
    .card-1 {
      animation: slideInLeft 0.8s ease-out 0.2s forwards;
    }

    /* KARTU KEDUA: Masuk dari Kanan (Jeda singkat setelah Kartu 1) */
    .card-2 {
      animation: slideInRight 0.8s ease-out 1.2s forwards;
    }

    /* KARTU KETIGA: Masuk dari Bawah (Jeda singkat setelah Kartu 2) */
    .card-3 {
      animation: slideInUp 0.8s ease-out 2.2s forwards;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
    }

    /* BALON MELAYANG */
    .balloon-container {
      margin-top: 15px;
      font-size: 2.2rem;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .balloon {
      display: inline-block;
      animation: bounce 1.8s infinite ease-in-out alternate;
    }

    .balloon:nth-child(2) { animation-delay: 0.3s; }
    .balloon:nth-child(3) { animation-delay: 0.6s; }

    /* UKURAN MEDIA / GIF KARTU 3 */
    .gift-mp4 {
      width: 100%;
      max-width: 220px;
      border-radius: 15px;
      margin-top: 15px;
    }

    /* --- KEYFRAMES ANIMASI MASUK --- */
    
    /* Masuk dari Kiri */
    @keyframes slideInLeft {
      0% {
        opacity: 0;
        transform: translateX(-120%);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Masuk dari Kanan */
    @keyframes slideInRight {
      0% {
        opacity: 0;
        transform: translateX(120%);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Masuk dari Bawah */
    @keyframes slideInUp {
      0% {
        opacity: 0;
        transform: translateY(50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Membal Balon */
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Kartu 1: Muncul Pertama dari Kiri -->
    <div class="card-1">
      <h1>🎉 Happy Birthday! 🎂</h1>
      <p>Met ultah @alizalsabela, Semoga harimu selalu always dan semua yu hep drim is tercapai!</p>
    </div>

    <!-- Kartu 2: Muncul Kedua dari Kanan -->
    <div class="card-2">
      <p>Sekali kali gunakan AI dengan baik dan benar, bersama AI jayakan indonesia, SELAMAT ULANG TAHUN INDONESIA YG KE-81</p>
      
      <div class="balloon-container">
        <span class="balloon">🎈</span>
        <span class="balloon">🎈</span>
        <span class="balloon">🎈</span>
      </div>
    </div>

    <!-- Kartu 3: Muncul Ketiga dari Bawah -->
    <div class="card-3">
      <p>🎁</p>
      <img src="stutu.mp4" alt="Gift MP4" class="gift-mp4">
    </div>
  </div>

</body>
</html>
