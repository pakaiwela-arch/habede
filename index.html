<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 500px;
      width: 100%;
    }

    .card-1 {
      background: rgba(255, 255, 255, 0.15);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
   
      animation: 
        fadeInUp 1s ease-out forwards,
        float 3s ease-in-out 1s infinite;
      opacity: 0; 
    }

    .card-2 {
      background: rgba(255, 255, 255, 0.1);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    
      animation: 
        fadeInUp 1s ease-out 0.5s forwards,
        pulse 2.5s ease-in-out 1.5s infinite;
      opacity: 0;
    }


    .card-1 h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      animation: fadeIn 1s ease-out 0.8s forwards;
      opacity: 0;
    }

    .card-1 p {
      font-size: 1rem;
      line-height: 1.5;
      animation: fadeIn 1s ease-out 1.1s forwards;
      opacity: 0;
    }

    .card-2 p {
      font-size: 1rem;
      line-height: 1.5;
      animation: fadeIn 1s ease-out 1.4s forwards;
      opacity: 0;
    }

    .balloon-container {
      margin-top: 15px;
      font-size: 2rem;
      display: flex;
      justify-content: center;
      gap: 15px;
      animation: fadeIn 1s ease-out 1.7s forwards;
      opacity: 0;
    }

    .balloon {
      display: inline-block;
      animation: bounce 2s infinite ease-in-out alternate;
    }

    .balloon:nth-child(2) { animation-delay: 0.3s; }
    .balloon:nth-child(3) { animation-delay: 0.6s; }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-15px); }
    }
  </style>
</head>
<body>

  <div class="content-container">
     <div class="card animation-float">
    <h1>🎉 Happy Birthday! 🎂</h1>
    <p>Met ultah, Semoga harimu selalu always dan semua yu hep drim is tercapai!</p>
     
     <div class="card animation-baloon">
    <p>HBD @alizaIsabela, sekali kali gunakan AI dengan baik dan benar, bersama AI jayakan indonesia, SELAMAT ULANG TAHUN INDONESIA YG KE-81 </p>
<div class="balloon-container">
  <span class="balloon b1">🎈</span>
  <span class="balloon b2">🎈</span>
  <span class="balloon b3">🎈</span>
  
</body>
</html>
